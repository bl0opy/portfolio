<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayan Chandrasekaran</title>
<meta name="description" content="Ayan Chandrasekaran builds at the intersection of software, hardware and sound. CS and Music at the University of Michigan.">
<meta name="theme-color" content="#8f8e8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@400;500&family=Permanent+Marker&display=swap">
<style>
  :root { --paper: #ebebe8; --ink: #161616; --muted: #55565a; --accent: #c93e08; --room: #8f8e8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--room); color: var(--ink); }
  html.plain, html.plain body { overflow: auto; height: auto; background: var(--paper); }
  canvas { display: block; touch-action: none; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hint {
    position: fixed; left: 24px; bottom: 22px; margin: 0; padding: 8px 12px; color: var(--paper);
    background: rgba(16, 16, 16, 0.82); font: 13px "Geist Mono", monospace; pointer-events: none;
  }
  #sound {
    all: unset; position: fixed; left: 24px; top: 24px; padding: 8px 12px; cursor: pointer; color: var(--paper);
    background: rgba(16, 16, 16, 0.82); font: 13px "Geist Mono", monospace;
  }
  #sound:hover { color: #ff4f00; }
  #sound:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #panel {
    position: fixed; top: 24px; right: 24px; bottom: 24px; width: min(440px, 36vw);
    display: flex; flex-direction: column; gap: 16px; padding: 24px;
    background: var(--paper); font-family: Archivo, sans-serif; overflow: hidden;
  }
  #panel[hidden], #hint[hidden], #sound[hidden] { display: none; }
  #panel header { display: flex; justify-content: space-between; gap: 16px; font: 13px "Geist Mono", monospace; color: var(--muted); }
  #panel h2 { margin: 0; font-stretch: 125%; font-weight: 800; font-size: clamp(30px, 3.2vw, 46px); line-height: 1.05; letter-spacing: -0.02em; }
  #panel h2.long { font-size: clamp(26px, 2.4vw, 34px); }
  #panel .stop { flex: 1; min-height: 0; overflow-y: auto; padding-right: 64px; animation: rise 260ms ease-out; }
  .copy { margin: 0; font-size: 19px; line-height: 1.42; }
  .specs { margin: 20px 0 0; font: 13px/1.45 "Geist Mono", monospace; }
  .specs div { padding: 10px 0; border-top: 1px solid var(--muted); }
  .specs dt { color: var(--muted); }
  .specs dd { margin: 2px 0 0; }
  .links { list-style: none; margin: 0; padding: 0; font-size: 19px; }
  .links a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; color: inherit; text-decoration: none; border-bottom: 1px solid var(--muted); }
  .links a:hover, .links a:focus-visible { color: var(--accent); }
  #panel .rail { position: absolute; right: 24px; top: 170px; bottom: 24px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
  #panel .rail button { all: unset; cursor: pointer; font: 12px "Geist Mono", monospace; color: var(--muted); padding: 4px 0; }
  #panel .rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #panel .rail button[aria-pressed="true"] { color: var(--accent); font-weight: 500; }
  #fallback { max-width: 680px; margin: 0 auto; padding: 48px 24px; font-family: Archivo, sans-serif; }
  #fallback section { padding: 32px 0; border-top: 1px solid var(--muted); }
  #fallback h2 { margin: 0; font-stretch: 125%; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; }
  #fallback .tag { margin: 6px 0 20px; font: 13px "Geist Mono", monospace; color: var(--muted); }
  #fallback .copy { margin-top: 16px; }
  noscript { display: block; padding: 48px 24px; font: 19px/1.42 Archivo, sans-serif; }
  noscript a { color: inherit; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { #panel .stop { animation: none; } }
  @media (max-width: 760px) {
    #panel { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; height: 46dvh; padding: 16px; gap: 8px; }
    #panel h2, #panel h2.long { font-size: 26px; }
    #panel .rail { position: static; order: -1; flex-direction: row; justify-content: flex-start; gap: 6px 14px; flex-wrap: wrap; }
    #panel header { order: -2; }
    #panel h2 { order: -2; }
    #panel .rail button { padding: 12px 2px; }
    #panel .stop { padding-right: 0; }
    .copy, .links { font-size: 17px; }
    #hint { left: 12px; bottom: 12px; }
    #sound { left: 12px; top: 12px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<h1 class="visually-hidden">Ayan Chandrasekaran</h1>
<button id="sound" type="button" hidden>SOUND OFF</button>
<aside id="panel" hidden aria-live="polite"></aside>
<p id="hint" hidden>Scroll to start. Slide a fader to read.</p>
<noscript>
  Ayan Chandrasekaran builds at the intersection of software, hardware and sound.
  <a href="https://github.com/bl0opy">GitHub</a> /
  <a href="https://linkedin.com/in/ayanchan/">LinkedIn</a> /
  <a href="https://bl0opy.github.io/resume/">Résumé</a>
</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
