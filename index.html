<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayan Chandrasekaran</title>
<meta name="description" content="Ayan Chandrasekaran builds at the intersection of software, hardware and sound. CS and Music at the University of Michigan.">
<meta name="theme-color" content="#8f8e8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@400;500&family=Permanent+Marker&display=swap">
<style>
  :root { --paper: #ebebe8; --ink: #161616; --muted: #55565a; --accent: #c93e08; --room: #8f8e8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--room); color: var(--ink); }
  html.plain, html.plain body { overflow: auto; height: auto; background: var(--paper); }
  canvas { display: block; touch-action: none; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .glass {
    color: var(--ink); background: linear-gradient(160deg, rgba(255, 255, 255, 0.78), rgba(235, 235, 232, 0.56));
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    border: 1px solid rgba(255, 255, 255, 0.55);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), inset 0 -1px 0 rgba(0, 0, 0, 0.06), 0 18px 50px rgba(20, 20, 20, 0.22);
  }
  #intro {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; cursor: pointer;
    background: rgba(143, 142, 138, 0.18); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    transition: opacity 450ms ease, backdrop-filter 450ms ease, -webkit-backdrop-filter 450ms ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
  #intro .card { width: min(440px, 100%); padding: 28px; border-radius: 28px; animation: rise 500ms ease-out; }
  #intro.gone .card { transform: scale(0.97); transition: transform 450ms ease; }
  #intro .kicker { margin: 0 0 8px; font: 12px "Geist Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  #intro h2 { margin: 0 0 20px; font: 800 30px/1.05 Archivo, sans-serif; font-stretch: 125%; letter-spacing: -0.02em; }
  #intro ul { list-style: none; margin: 0 0 24px; padding: 0; display: grid; gap: 14px; }
  #intro li { display: flex; gap: 14px; align-items: center; font: 16px/1.35 Archivo, sans-serif; }
  #intro button {
    all: unset; box-sizing: border-box; width: 100%; padding: 14px; border-radius: 999px; text-align: center; cursor: pointer;
    font: 500 14px "Geist Mono", monospace; color: #fff; background: var(--accent);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 6px 18px rgba(201, 62, 8, 0.35);
  }
  #intro button:hover { background: #ff4f00; }
  #intro button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #coach {
    position: fixed; z-index: 5; left: calc((100vw - min(440px, 36vw) - 24px) / 2); bottom: 22px;
    max-width: calc(100vw - min(440px, 36vw) - 360px); margin: 0; padding: 9px 16px 9px 10px; border-radius: 999px;
    display: flex; gap: 10px; align-items: center; font: 13px/1.3 "Geist Mono", monospace; pointer-events: none;
    opacity: 0; transform: translate(-50%, 10px); transition: opacity 400ms ease, transform 400ms ease;
  }
  #coach.on { opacity: 1; transform: translate(-50%, 0); }
  #coach.wide { left: 50%; max-width: calc(100vw - 360px); }
  #intro i, #coach i { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
  .glyph { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .glyph > g { display: none; }
  .i-wheel .g-wheel, .i-swipe .g-swipe, .i-card .g-card, .i-home .g-home { display: inline; }
  .glyph .dot { stroke: var(--accent); stroke-width: 2; animation: wheel 1.4s ease-in-out infinite; }
  .glyph .arrow { stroke: var(--accent); }
  .glyph .tip { fill: var(--accent); stroke: none; animation: swipe 1.6s ease-in-out infinite; }
  .glyph .trail { stroke: rgba(22, 22, 22, 0.25); stroke-dasharray: 2 3; }
  .g-card { clip-path: inset(3px 5px 3px 5px round 2px); }
  .g-card > rect { clip-path: none; }
  .glyph .lines { stroke: var(--accent); animation: card 2.2s ease-in-out infinite; }
  @keyframes wheel { 0%, 20% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(4px); opacity: 0; } 100% { opacity: 0; } }
  @keyframes swipe { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 80% { transform: translateY(-12px); opacity: 0; } 100% { opacity: 0; } }
  @keyframes card { 0%, 15% { transform: translateY(0); } 70%, 100% { transform: translateY(-8px); } }
  #sound {
    all: unset; position: fixed; left: 24px; top: 24px; width: 36px; height: 34px; display: grid; place-items: center;
    cursor: pointer; color: var(--paper); background: rgba(16, 16, 16, 0.82);
  }
  #sound[aria-pressed="true"] .muted, #sound[aria-pressed="false"] .waves { display: none; }
  .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }
  #sound:hover { color: #ff4f00; }
  #sound:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #nav { position: fixed; left: 24px; bottom: 22px; display: flex; gap: 4px; }
  #nav button {
    all: unset; width: 36px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--paper);
    background: rgba(16, 16, 16, 0.82); font: 15px/34px "Geist Mono", monospace;
  }
  #nav button:hover { color: #ff4f00; }
  #nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #nav button:disabled, #nav button:disabled:hover { color: var(--muted); cursor: default; }
  #panel {
    position: fixed; top: 24px; right: 24px; bottom: 24px; width: min(440px, 36vw);
    display: flex; flex-direction: column; gap: 16px; padding: 24px;
    background: var(--paper); font-family: Archivo, sans-serif; overflow: hidden;
  }
  #panel[hidden], #intro[hidden], #coach[hidden], #sound[hidden], #nav[hidden] { display: none; }
  #panel header { display: flex; justify-content: space-between; gap: 16px; font: 13px "Geist Mono", monospace; color: var(--muted); }
  #panel header span:first-child { white-space: nowrap; }
  #panel h2 { margin: 0; font-stretch: 125%; font-weight: 800; font-size: clamp(30px, 3.2vw, 46px); line-height: 1.05; letter-spacing: -0.02em; }
  #panel h2.long { font-size: clamp(26px, 2.4vw, 34px); }
  #panel .stop { flex: 1; min-height: 0; overflow-y: auto; padding-right: 64px; animation: rise 260ms ease-out; }
  .copy { margin: 0; font-size: 19px; line-height: 1.42; }
  .specs { margin: 20px 0 0; font: 13px/1.45 "Geist Mono", monospace; }
  .specs div { padding: 10px 0; border-top: 1px solid var(--muted); }
  .specs dt { color: var(--muted); }
  .specs dd { margin: 2px 0 0; }
  .links { list-style: none; margin: 0; padding: 0; font-size: 19px; }
  .links a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; color: inherit; text-decoration: none; border-bottom: 1px solid var(--muted); }
  .links a:hover, .links a:focus-visible { color: var(--accent); }
  #panel .rail { position: absolute; right: 24px; top: 170px; bottom: 24px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
  #panel .rail button { all: unset; cursor: pointer; font: 12px "Geist Mono", monospace; color: var(--muted); padding: 4px 0; }
  #panel .rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #panel .rail button[aria-pressed="true"] { color: var(--accent); font-weight: 500; }
  #fallback { max-width: 680px; margin: 0 auto; padding: 48px 24px; font-family: Archivo, sans-serif; }
  #fallback section { padding: 32px 0; border-top: 1px solid var(--muted); }
  #fallback h2 { margin: 0; font-stretch: 125%; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; }
  #fallback .tag { margin: 6px 0 20px; font: 13px "Geist Mono", monospace; color: var(--muted); }
  #fallback .copy { margin-top: 16px; }
  noscript { display: block; padding: 48px 24px; font: 19px/1.42 Archivo, sans-serif; }
  noscript a { color: inherit; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { #panel .stop, #intro .card, .glyph * { animation: none !important; } #intro, #coach { transition: none; } }
  @media (max-width: 760px) {
    #panel { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; height: 46dvh; padding: 16px; gap: 8px; }
    #panel h2, #panel h2.long { font-size: 26px; }
    #panel .rail { position: static; order: -1; flex-direction: row; justify-content: flex-start; gap: 6px 14px; flex-wrap: wrap; }
    #panel header { order: -2; }
    #panel h2 { order: -2; }
    #panel .rail button { padding: 12px 2px; }
    #panel .stop { padding-right: 0; }
    .copy, .links { font-size: 17px; }
    #coach, #coach.wide { left: 12px; right: 12px; bottom: calc(46dvh + 24px); width: fit-content; max-width: none; margin-inline: auto; transform: translateY(10px); }
    #coach.wide { bottom: 24px; }
    #coach.on { transform: none; }
    #intro .card { padding: 22px; border-radius: 24px; }
    #intro h2 { font-size: 26px; }
    #sound { left: 12px; top: 12px; width: 44px; height: 44px; }
    #nav { left: auto; right: 12px; bottom: auto; top: 12px; }
    #nav button { width: 44px; height: 44px; }
  }
</style>
<script type="importmap">
{ "imports": {

</head>
<body>

  <svg class="icon" viewBox="0 0 18 18" aria-hidden="true">
    <path d="M2.5 7v4h3l4 3.5v-11l-4 3.5z"/>
